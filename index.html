<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NUVY PHOTO SUMMER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+KR:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #f5ede0;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .screen {
    position: fixed; inset: 0;
    display: none;
  }
  .screen.active { display: block; }

  /* ═══ 플래시 ═══ */
  #flash {
    position: fixed; inset: 0;
    background: white; opacity: 0;
    pointer-events: none; z-index: 9999;
    transition: opacity 0.04s;
  }
  #flash.on { opacity: 1; }

  /* 배경 이미지 공통 */
  .bg-image {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    display: block;
    z-index: 0;
  }

  /* ═══ SCREEN 1 — MAIN ═══ */
  #screen-main {
    position: relative;
    width: 100%; height: 100%;
  }

  #main-video-wrap {
    position: absolute;
    left: 329px; top: 194px;
    width: 522px; height: 462px;
    z-index: 1;
    overflow: hidden;
    border-radius: 4px;
  }
  #main-video {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    display: block;
  }

  #btn-start {
    position: absolute;
    left: 50%; bottom: 52px;
    transform: translateX(-50%);
    z-index: 2;
    background: #5ab0e0;
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 16px 56px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(90,176,224,0.4);
    transition: all 0.15s;
  }
  #btn-start:active { transform: translateX(-50%) scale(0.97); }

  /* ═══ SCREEN 3 — SHOOT ═══ */
  #screen-shoot {
    position: relative;
    width: 100%; height: 100%;
  }

  #shoot-video-wrap {
    position: absolute;
    left: 219px; top: 82px;
    width: 741px; height: 656px;
    z-index: 1;
    overflow: hidden;
    border-radius: 4px;
  }
  #shoot-video {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    display: block;
  }

  #hud-count {
    position: absolute;
    top: 20px; right: 28px;
    z-index: 5;
    font-family: 'Fredoka One', cursive;
    font-size: 40px;
    color: #000000;
  }

  #notify-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.42);
  }
  #notify-overlay.show { display: flex; }

  .notify-box { text-align: center; color: #fff; }
  .notify-title {
    font-family: 'Fredoka One', cursive;
    font-size: 48px;
    letter-spacing: 0.04em;
    text-shadow: 0 2px 16px rgba(0,0,0,0.4);
    margin-bottom: 12px;
  }
  .notify-sub {
    font-size: 22px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.08em;
  }

  #countdown-overlay {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    display: none;
    pointer-events: none;
  }
  #countdown-overlay.show { display: flex; }

  #countdown-num {
    font-family: 'Fredoka One', cursive;
    font-size: 100px;
    color: #fff;
    text-shadow:
      0 0 40px rgba(255,255,255,0.5),
      0 4px 16px rgba(0,0,0,0.4);
    animation: cd-pop 0.9s ease-out forwards;
  }
  @keyframes cd-pop {
    0%   { transform: scale(1.5); opacity: 0; }
    40%  { transform: scale(1.0); opacity: 1; }
    90%  { transform: scale(0.9); opacity: 0.8; }
    100% { opacity: 0.6; }
  }

  /* ═══ SCREEN 4 — RESULT ═══ */
  #screen-result {
    position: relative;
    width: 100%; height: 100%;
  }

  #result-img-wrap {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -48%);
    z-index: 1;
  }

  #result-display {
    max-height: 55vh;
    aspect-ratio: 735/980;
    display: block;
    border-radius: 6px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
  }

  .result-btns {
    position: absolute;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    gap: 16px;
  }

  .btn-main {
    background: #5ab0e0; color: #fff;
    border: none; border-radius: 50px;
    padding: 14px 36px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 17px; font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(90,176,224,0.35);
    transition: all 0.15s;
  }
  .btn-main:active { transform: scale(0.97); }

  .btn-sub {
    background: transparent; color: #5ab0e0;
    border: 2.5px solid #5ab0e0;
    border-radius: 50px;
    padding: 13px 32px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 17px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-sub:active { background: #5ab0e0; color: #fff; }

  /* QR 화면 처음으로 버튼 — 하늘색 배경 */
  #screen-qr .btn-sub {
    background: #5ab0e0;
    color: #fff;
  }
  #screen-qr .btn-sub:active { background: #3a90c0; }

  /* ═══ SCREEN 5 — QR ═══ */
  #screen-qr {
    position: relative;
    width: 100%; height: 100%;
  }

  #qr-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 1;
  }

  /* 문구 숨김 — QR 기능은 유지 */
  #qr-status { display: none; }
  .qr-hint   { display: none; }
  .qr-brand  { display: none; }

  #qr-box {
    padding: 20px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(90,176,224,0.2);
  }

  #cap-canvas { display: none; }
  #result-canvas { display: none; }
</style>
</head>
<body>

<div id="flash"></div>
<canvas id="cap-canvas"></canvas>
<canvas id="result-canvas"></canvas>

<!-- ══ SCREEN 1: MAIN ══ -->
<div id="screen-main" class="screen active">
  <img class="bg-image" src="main_bg.png" alt="">
  <div id="main-video-wrap">
    <video id="main-video" autoplay playsinline muted></video>
  </div>
  <button id="btn-start" onclick="startShooting()">시작하기</button>
</div>

<!-- ══ SCREEN 3: SHOOT ══ -->
<div id="screen-shoot" class="screen">
  <img class="bg-image" src="shoot_bg.png" alt="">
  <div id="shoot-video-wrap">
    <video id="shoot-video" autoplay playsinline muted></video>
  </div>
  <div id="hud-count">1/2</div>
  <div id="notify-overlay">
    <div class="notify-box">
      <div class="notify-title">2번 촬영됩니다</div>
      <div class="notify-sub">카메라 위치는 왼쪽에 있어요 📷</div>
    </div>
  </div>
  <div id="countdown-overlay">
    <span id="countdown-num">5</span>
  </div>
</div>

<!-- ══ SCREEN 4: RESULT ══ -->
<div id="screen-result" class="screen">
  <img class="bg-image" src="download_bg.png" alt="">
  <div id="result-img-wrap">
    <img id="result-display" src="" alt="결과 사진">
  </div>
  <div class="result-btns">
    <button class="btn-sub" onclick="goHome()">처음으로</button>
    <button class="btn-sub" onclick="retake()">재촬영</button>
    <button class="btn-main" onclick="uploadAndQR()">다운로드 →</button>
  </div>
</div>

<!-- ══ SCREEN 5: QR ══ -->
<div id="screen-qr" class="screen">
  <img class="bg-image" src="qr_bg.png" alt="">
  <div id="qr-content">
    <p id="qr-status">업로드 중...</p>
    <div id="qr-box"></div>
    <p class="qr-hint">스캔하면 사진을 저장할 수 있어요 📷</p>
    <p class="qr-brand">made by. NUVY.PHOTO</p>
    <button class="btn-sub" onclick="goHome()">처음으로</button>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getStorage, ref, uploadBytes, getDownloadURL }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBRF4E9uaVYSa4ZnLasHv7-fmGejkKTPtM",
    authDomain: "nuvymini.firebaseapp.com",
    projectId: "nuvymini",
    storageBucket: "nuvymini.firebasestorage.app",
    messagingSenderId: "146917590198",
    appId: "1:146917590198:web:40c91453c3d454e9541217"
  };
  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);
  window._fb = { storage, ref, uploadBytes, getDownloadURL };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
// ══════════════════════════════════════
//  SCREEN NAVIGATION
// ══════════════════════════════════════
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ══════════════════════════════════════
//  CAMERA
// ══════════════════════════════════════
let camStream = null;

async function startCamera() {
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    document.getElementById('main-video').srcObject = camStream;
    document.getElementById('shoot-video').srcObject = camStream;
  } catch(e) {
    alert('카메라 접근 불가 (HTTPS 필요)');
  }
}

// ══════════════════════════════════════
//  TEMPLATE 설정
//  사진 슬롯: 280×248px
//  photo1: x:227, y:189
//  photo2: x:227, y:531
// ══════════════════════════════════════
const TEMPLATE = {
  w: 735, h: 980,
  photo1: { x: 227, y: 189, w: 280, h: 248 },
  photo2: { x: 227, y: 531, w: 280, h: 248 },
};

let capturedFrames = [];
let shootIndex = 0;
let templateImg = null;

function preloadTemplate() {
  return new Promise(resolve => {
    templateImg = new Image();
    templateImg.onload = resolve;
    templateImg.onerror = resolve;
    templateImg.src = 'nuvymini_summer1.png';
  });
}

// ══════════════════════════════════════
//  SHOOTING FLOW
// ══════════════════════════════════════
function startShooting() {
  capturedFrames = [];
  shootIndex = 0;
  goTo('screen-shoot');
  document.getElementById('hud-count').textContent = '1/2';

  const notify = document.getElementById('notify-overlay');
  notify.classList.add('show');
  setTimeout(() => {
    notify.classList.remove('show');
    scheduleNextShot();
  }, 3000);
}

function scheduleNextShot() {
  let count = 5;
  const overlay = document.getElementById('countdown-overlay');
  const numEl   = document.getElementById('countdown-num');

  overlay.classList.add('show');
  numEl.textContent = count;
  numEl.style.animation = 'none';
  void numEl.offsetWidth;
  numEl.style.animation = 'cd-pop 0.9s ease-out forwards';

  const iv = setInterval(() => {
    count--;
    if (count > 0) {
      numEl.textContent = count;
      numEl.style.animation = 'none';
      void numEl.offsetWidth;
      numEl.style.animation = 'cd-pop 0.9s ease-out forwards';
    } else {
      clearInterval(iv);
      overlay.classList.remove('show');
      captureFrame();
    }
  }, 1000);
}

function captureFrame() {
  const flash = document.getElementById('flash');
  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 120);

  const video = document.getElementById('shoot-video');
  const tmpCanvas = document.getElementById('cap-canvas');

  const vw = video.videoWidth, vh = video.videoHeight;
  let sx = 0, sy = 0, sw = vw, sh = vh;
  const slot = shootIndex === 0 ? TEMPLATE.photo1 : TEMPLATE.photo2;
  const targetR = slot.w / slot.h;
  if (vw / vh > targetR) { sw = vh * targetR; sx = (vw - sw) / 2; }
  else { sh = vw / targetR; sy = (vh - sh) / 2; }

  // 3배 스케일로 촬영 → 화질 선명
  const SCALE = 3;
  tmpCanvas.width  = slot.w * SCALE;
  tmpCanvas.height = slot.h * SCALE;
  const ctx = tmpCanvas.getContext('2d');
  ctx.translate(tmpCanvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, tmpCanvas.width, tmpCanvas.height);

  capturedFrames.push(tmpCanvas.toDataURL('image/png')); // PNG로 무손실 저장
  shootIndex++;

  if (shootIndex < 2) {
    document.getElementById('hud-count').textContent = '2/2';
    setTimeout(() => scheduleNextShot(), 800);
  } else {
    compositeAndShow();
  }
}

async function compositeAndShow() {
  await preloadTemplate();

  const canvas = document.getElementById('result-canvas');
  canvas.width  = TEMPLATE.w;
  canvas.height = TEMPLATE.h;
  const ctx = canvas.getContext('2d');

  // 흰 배경
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, TEMPLATE.w, TEMPLATE.h);

  // 사진 먼저 (아래) — 슬롯 좌표에 맞게 축소해서 그리기
  const slots = [TEMPLATE.photo1, TEMPLATE.photo2];
  for (let i = 0; i < 2; i++) {
    const img = new Image();
    await new Promise(res => { img.onload = res; img.src = capturedFrames[i]; });
    const s = slots[i];
    ctx.drawImage(img, s.x, s.y, s.w, s.h);
  }

  // 템플릿 프레임 위에 (위)
  if (templateImg && templateImg.complete && templateImg.naturalWidth > 0) {
    ctx.drawImage(templateImg, 0, 0, TEMPLATE.w, TEMPLATE.h);
  }

  const dataURL = canvas.toDataURL('image/jpeg', 0.95);
  document.getElementById('result-display').src = dataURL;
  goTo('screen-result');
}

// ══════════════════════════════════════
//  RETAKE / HOME
// ══════════════════════════════════════
function retake() {
  capturedFrames = [];
  shootIndex = 0;
  document.getElementById('hud-count').textContent = '1/2';
  startShooting();
}

function goHome() {
  capturedFrames = [];
  shootIndex = 0;
  document.getElementById('result-display').src = '';
  document.getElementById('qr-box').innerHTML = '';
  document.getElementById('qr-status').textContent = '업로드 중...';
  goTo('screen-main');
}

// ══════════════════════════════════════
//  UPLOAD + QR
// ══════════════════════════════════════
async function uploadAndQR() {
  goTo('screen-qr');
  document.getElementById('qr-status').textContent = '업로드 중...';
  document.getElementById('qr-box').innerHTML = '';

  try {
    const canvas = document.getElementById('result-canvas');
    const blob = await new Promise((res, rej) =>
      canvas.toBlob(b => b ? res(b) : rej(new Error('toBlob 실패')), 'image/jpeg', 0.95)
    );

    const fb = window._fb;
    if (!fb) throw new Error('Firebase 초기화 안됨');

    const sRef = fb.ref(fb.storage, `popup/${Date.now()}.jpg`);
    await fb.uploadBytes(sRef, blob, { contentType: 'image/jpeg' });
    const url = await fb.getDownloadURL(sRef);
    const qrURL = `https://nuvymini.vercel.app/download.html?img=${btoa(url)}`;

    document.getElementById('qr-status').textContent = 'QR을 스캔하세요!';
    new QRCode(document.getElementById('qr-box'), {
      text: qrURL,
      width: 220, height: 220,
      colorDark: '#1a2a3a',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch(e) {
    document.getElementById('qr-status').textContent = '❌ ' + e.message;
    console.error(e);
  }
}

window.startShooting = startShooting;
window.retake        = retake;
window.goHome        = goHome;
window.uploadAndQR   = uploadAndQR;

window.addEventListener('load', startCamera);
</script>
</body>
</html>
