<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NUVY PHOTO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    background: #F2EFE9; /* 따뜻하고 고급스러운 크림 베이지 */
    font-family: 'Noto Sans KR', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #1C352D; /* 깊이감 있는 딥 홀리그린 */
    -webkit-font-smoothing: antialiased;
  }

  .container {
    width: 100%;
    max-width: 420px;
    padding: 52px 24px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  /* 1. 헤더: 선명하고 간결한 브랜딩 */
  .brand-header {
    text-align: center;
  }

  .brand-logo {
    font-family: 'Montserrat', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: #1C352D;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .page-date {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    color: #8A9A86;
    letter-spacing: 0.25em;
    font-weight: 500;
    margin-top: 6px;
  }

  /* 2. 사진 영역: 하이엔드 액자 감성 + 터치 반응 UX */
  .photo-wrap {
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 16px 48px rgba(28, 53, 45, 0.12);
    background: #E5E1D8;
    position: relative;
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  }
  
  /* 사용자가 사진에 집중하도록 터치/클릭 시 반응하는 효과 */
  .photo-wrap:active {
    transform: scale(0.99);
  }

  #receipt-img {
    width: 100%;
    display: block;
    opacity: 0;
    transition: opacity 0.5s ease;
    -webkit-touch-callout: default; /* 모바일 저장 팝업 필수 */
  }
  #receipt-img.loaded { opacity: 1; }

  /* 미니멀 로딩 프로그래스 */
  .photo-loading {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #E5E1D8;
  }
  .photo-loading.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 26px; height: 26px;
    border: 2px solid rgba(28, 53, 45, 0.1);
    border-top-color: #1C352D;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-txt {
    font-size: 11px;
    color: #8A9A86;
    letter-spacing: 0.1em;
  }

  /* 3. 저장 안내: 직관적인 인터페이스 분할 (아이폰/갤럭시) */
  .save-guide {
    width: 100%;
    background: #FFFFFF;
    border: 1px solid rgba(28, 53, 45, 0.05);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 24px rgba(28, 53, 45, 0.02);
  }

  .finger-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 700;
    color: #1C352D;
  }

  .finger-icon {
    font-size: 18px;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* 기종별 직관적 가이드 칩 디자인 */
  .os-badge-group {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .os-badge {
    font-size: 11px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 20px;
    background: #F2EFE9;
    color: #6B7C75;
  }
  .os-badge strong {
    color: #1C352D;
    font-weight: 700;
  }

  /* 감성 슬로건 분할선 겸용 */
  .brand-slogan {
    font-size: 13px;
    color: #6B7C75;
    text-align: center;
    line-height: 1.6;
    letter-spacing: -0.01em;
    margin: 4px 0;
  }

  /* 4. 인스타그램 유도: 깊이감 있는 브랜드 시그니처 카드 */
  .insta-container {
    width: 100%;
    text-decoration: none;
  }

  .insta-card {
    width: 100%;
    background: #1C352D; /* 누비포토 시그니처 컬러 */
    border-radius: 16px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 10px 30px rgba(28, 53, 45, 0.15);
    transition: transform 0.2s ease, background-color 0.2s ease;
  }
  
  .insta-card:active {
    transform: scale(0.98);
    background: #142721;
  }

  .insta-content {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .insta-icon-box {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #F2EFE9;
  }

  .insta-icon { width: 22px; height: 22px; }

  .insta-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }

  .insta-title {
    font-size: 11px;
    color: #8A9A86;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .insta-id {
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #F2EFE9;
    letter-spacing: 0.02em;
  }

  .arrow-btn {
    color: #8A9A86;
    width: 20px;
    height: 20px;
  }

  /* 푸터 크레딧 */
  .footer-credit {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    color: rgba(28, 53, 45, 0.35);
    letter-spacing: 0.2em;
    font-weight: 700;
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="container">

  <!-- 1. 타이틀 영역 -->
  <header class="brand-header">
    <h1 class="brand-logo">NUVY PHOTO MiniBooth</h1>
    <p class="page-date" id="today-date">—</p>
  </header>

  <!-- 2. 메인 사진 영역 -->
  <main class="photo-wrap">
    <div class="photo-loading" id="photo-loading">
      <div class="spinner"></div>
      <p class="loading-txt">추억을 불러오는 중</p>
    </div>
    <img id="receipt-img" src="" alt="NUBY PHOTO">
  </main>

  <!-- 3. 저장 안내 영역 (UX 인지 최적화) -->
  <section class="save-guide">
    <div class="finger-hint">
      <span class="finger-icon">👆</span>
      <p class="save-guide-main">사진을 길게 누르고 저장 버튼을 눌려주세요</p>
    </div>
    <div class="os-badge-group">
      <span class="os-badge">iPhone: <strong>사진 앱에 저장</strong></span>
      <span class="os-badge">Galaxy: <strong>이미지 다운로드</strong></span>
    </div>
  </section>

  <!-- 브랜딩 감성 카피 -->
  <p class="brand-slogan">
    누비포토 썸머팝업과 함께한 오늘 🌊<br>
    오늘의 소중한 기억이 따뜻하게 간직되기를<br>
    카카오톡 배경, 인스타그램 등 활용해보세요
  </p>

  <!-- 4. 인스타그램 안내 영역 (브랜드 딥링크) -->
  <a class="insta-container" href="https://www.instagram.com/nuvy.photo" target="_blank">
    <div class="insta-card">
      <div class="insta-content">
        <div class="insta-icon-box">
          <svg class="insta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </div>
        <div class="insta-text">
          <span class="insta-title">스토리에 태그하고 추억 공유하기</span>
          <span class="insta-id">@nuvy.photo</span>
        </div>
      </div>
      <svg class="arrow-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </div>
  </a>

  <!-- 푸터 -->
  <footer class="footer-credit">NUVY PHOTO × SUMMER POPUP</footer>

</div>

<script>
  // 오늘 날짜 자동 세팅
  (function() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth()+1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    document.getElementById('today-date').textContent = `${y} . ${m} . ${d}`;
  })();

  let imageURL = null;

  function getParam(key) {
    return new URLSearchParams(window.location.search).get(key);
  }

  function loadPhoto() {
    const imgParam = getParam('img');
    if (!imgParam) {
      document.getElementById('photo-loading').innerHTML =
        '<p class="loading-txt">이미지 정보가 없습니다.</p>';
      return;
    }

    imageURL = atob(imgParam);
    const img = document.getElementById('receipt-img');

    img.onload = () => {
      img.classList.add('loaded');
      document.getElementById('photo-loading').classList.add('hidden');
    };
    img.onerror = () => {
      document.getElementById('photo-loading').innerHTML =
        '<p class="loading-txt">이미지를 불러올 수 없습니다.</p>';
    };
    img.src = imageURL;
  }

  window.addEventListener('load', loadPhoto);
</script>
</body>
</html>
