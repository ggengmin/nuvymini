<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NUVY PHOTO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    background: #F5EAD8;
    font-family: 'Noto Sans KR', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 420px;
    padding: 52px 24px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  /* 상단 타이틀 */
  .page-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 700;
    color: #3A2A1A;
    letter-spacing: 0.06em;
    text-align: center;
  }

  .page-date {
    font-size: 12px;
    color: #9A7A5A;
    letter-spacing: 0.2em;
    text-align: center;
    font-weight: 500;
    margin-top: -10px;
  }

  /* 사진 영역 */
  .photo-wrap {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(90,60,20,0.15);
    background: #D4C4A8;
    position: relative;
    min-height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #receipt-img {
    width: 100%;
    display: block;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #receipt-img.loaded { opacity: 1; }

  .photo-loading {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: opacity 0.4s;
  }
  .photo-loading.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 32px; height: 32px;
    border: 2.5px solid rgba(90,60,20,0.2);
    border-top-color: #9A7A5A;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-txt {
    font-size: 11px;
    color: #9A7A5A;
    letter-spacing: 0.12em;
  }

  /* 구분선 */
  .divider {
    width: 100%;
    height: 1px;
    background: rgba(90,60,20,0.12);
  }

  /* 저장 안내 */
  .save-guide {
    width: 100%;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(90,60,20,0.1);
    border-radius: 10px;
    padding: 16px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .finger-icon {
    font-size: 28px;
    animation: press 1.6s ease-in-out infinite;
    display: inline-block;
    transform-origin: bottom center;
  }
  @keyframes press {
    0%, 100% { transform: translateY(0) scale(1); }
    40%       { transform: translateY(4px) scale(0.9); }
    60%       { transform: translateY(4px) scale(0.9); }
    80%       { transform: translateY(0) scale(1); }
  }

  .save-guide-main {
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 700;
    color: #3A2A1A;
    letter-spacing: 0.02em;
  }

  .save-guide-sub {
    font-size: 12px;
    color: #7A6050;
    line-height: 1.7;
    letter-spacing: 0.02em;
  }

  /* 설명 텍스트 */
  .desc {
    font-size: 13px;
    color: #7A6050;
    text-align: center;
    line-height: 1.9;
    letter-spacing: 0.03em;
  }

  /* 인스타 영역 */
  .insta-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .insta-label {
    font-size: 10px;
    color: #9A7A5A;
    letter-spacing: 0.2em;
    font-weight: 700;
  }

  .insta-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    text-decoration: none;
    color: #3A2A1A;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.04em;
    font-family: 'Noto Serif KR', serif;
    transition: color 0.15s;
    border-bottom: 1.5px solid rgba(90,60,20,0.25);
    padding-bottom: 2px;
  }
  .insta-link:hover { color: #C4622A; border-color: #C4622A; }

  .insta-icon { width: 18px; height: 18px; flex-shrink: 0; }

  /* 브랜드 */
  .made-by {
    font-size: 10px;
    color: rgba(90,60,20,0.45);
    letter-spacing: 0.22em;
    font-weight: 700;
    text-align: center;
  }
</style>
</head>
<body>

<div class="container">

  <h1 class="page-title">오늘의 한 컷</h1>
  <p class="page-date" id="today-date">—</p>

  <div class="photo-wrap">
    <div class="photo-loading" id="photo-loading">
      <div class="spinner"></div>
      <p class="loading-txt">불러오는 중</p>
    </div>
    <img id="receipt-img" src="" alt="nuvy photo">
  </div>

  <div class="save-guide">
    <span class="finger-icon">👆</span>
    <p class="save-guide-main">사진을 꾹 눌러서 저장하세요</p>
    <p class="save-guide-sub">사진 위에서 길게 누르면<br>저장 옵션이 나타나요</p>
  </div>

  <div class="divider"></div>

  <p class="desc">
    누비포토 썸머팝업에서 찍은 나의 한 컷 🌊<br>
    소중한 순간을 저장하고 공유해보세요!
  </p>

  <div class="insta-wrap">
    <p class="insta-label">MADE BY</p>
    <a class="insta-link" href="https://www.instagram.com/nuvy.photo" target="_blank">
      <svg class="insta-icon" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
        <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/>
      </svg>
      @nuvy.photo
    </a>
  </div>

  <p class="made-by">NUVY PHOTO × SUMMER POPUP</p>

</div>

<script>
  // 날짜 자동
  (function() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth()+1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    document.getElementById('today-date').textContent = `${y} · ${m} · ${d}`;
  })();

  let imageURL = null;

  function getParam(key) {
    return new URLSearchParams(window.location.search).get(key);
  }

  function loadPhoto() {
    const imgParam = getParam('img');
    if (!imgParam) {
      document.getElementById('photo-loading').innerHTML =
        '<p class="loading-txt">이미지 정보가 없습니다.</p>';
      return;
    }

    imageURL = atob(imgParam);
    const img = document.getElementById('receipt-img');

    img.onload = () => {
      img.classList.add('loaded');
      document.getElementById('photo-loading').classList.add('hidden');
    };
    img.onerror = () => {
      document.getElementById('photo-loading').innerHTML =
        '<p class="loading-txt">이미지를 불러올 수 없습니다.</p>';
    };
    img.src = imageURL;
  }

  window.addEventListener('load', loadPhoto);
</script>
</body>
</html>
